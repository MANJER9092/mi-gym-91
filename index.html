<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mi Gym 90 · Ilustrado</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:3}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#cbd5e1;font-size:13px}
main{max-width:720px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:0;background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;white-space:nowrap}.tab.active{background:#16a34a;color:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:14px;margin-bottom:12px}.day{display:flex;justify-content:space-between;gap:10px;align-items:center}.day h2{margin:0;font-size:19px}.tag{font-size:11px;background:#dcfce7;color:#166534;padding:5px 8px;border-radius:999px;font-weight:700}
.progress{height:8px;background:#e5e7eb;border-radius:99px;margin:10px 0;overflow:hidden}.bar{height:100%;background:#16a34a;width:0}
.exercise{border-top:1px solid #e5e7eb;padding:14px 0}.exercise:first-child{border-top:0}.title{display:flex;justify-content:space-between;gap:10px}.title h3{margin:0;font-size:17px}.sets{font-size:13px;color:#6b7280;margin:4px 0 9px}
figure{margin:0;background:#f8fafc;border-radius:14px;padding:8px}.caption{display:flex;justify-content:space-around;font-size:11px;color:#475569;font-weight:700;margin-top:-3px}
svg{width:100%;height:175px}.machine{stroke:#334155;stroke-width:7;stroke-linecap:round;fill:none}.person{stroke:#111827;stroke-width:8;stroke-linecap:round;fill:none}.joint{fill:#f59e0b;stroke:#111827;stroke-width:3}.muscle{fill:#ef4444;opacity:.8}
button.action{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 10px;font-weight:700}.action.done{background:#dcfce7;border-color:#86efac;color:#166534}.note{font-size:12px;color:#6b7280;margin-top:7px}
.timer{background:#111827;color:#fff;border-radius:16px;padding:12px;text-align:center;margin-bottom:12px}.timer b{display:block;font-size:30px}.timer button{border:0;border-radius:9px;padding:7px 11px;margin:3px;font-weight:700}
</style>
</head>
<body>
<header><h1>💪 Mi Gym 90</h1><p>Rutina ilustrada · 114 kg → 90 kg · 4 días</p></header>
<main><div class="tabs" id="tabs"></div>
<div class="timer">Descanso <b id="clock">01:30</b><button onclick="start(60)">60 s</button><button onclick="start(90)">90 s</button><button onclick="reset()">Reiniciar</button></div>
<div id="app"></div></main>
<script>
const data=[
["Día 1","Pecho · espalda · brazos",[
["Press de pecho en máquina","3 × 10–12","Hombro cómodo","press"],
["Jalón al pecho","3 × 10–12","No llevar la barra detrás de la cabeza","pulldown"],
["Remo sentado en máquina","3 × 10–12","Espalda estable","row"],
["Press inclinado en máquina","2 × 10–12","Solo si no molesta el hombro","incline"],
["Curl de bíceps","2 × 12–15","Movimiento controlado","curl"],
["Tríceps en polea","2 × 12–15","Codos estables","triceps"],
["Cardio","10–15 min","Bicicleta, elíptica o caminadora","cardio"]]],
["Día 2","Piernas · cardio",[
["Prensa de piernas","3 × 10–12","Sin bloquear las rodillas","legpress"],
["Curl femoral","3 × 12","Controla la bajada","legcurl"],
["Extensión de piernas","3 × 12","Sin rebotes","extension"],
["Hip thrust en máquina","3 × 10–12","Empuja con control","hip"],
["Abductores","2 × 15","Sin rebotes","abductor"],
["Gemelos sentado","2 × 15","Solo si el tobillo está cómodo","calf"],
["Cardio","10–15 min","Bicicleta o elíptica; no correr al inicio","cardio"]]],
["Día 3","Espalda · pecho · brazos",[
["Remo sentado","3 × 10–12","Controla cada repetición","row"],
["Jalón al pecho neutro","3 × 10–12","Sin dolor de hombro","pulldown"],
["Press de pecho en máquina","3 × 10–12","Rango cómodo","press"],
["Pec deck","2 × 12–15","No fuerces la apertura","pecdeck"],
["Curl de bíceps","2 × 12–15","Máquina o cable","curl"],
["Tríceps con cuerda","2 × 12–15","Codos cerca del cuerpo","triceps"],
["Cardio","15 min","Bicicleta o elíptica","cardio"]]],
["Día 4","Piernas · cardio",[
["Prensa de piernas","3 × 12","Carga moderada","legpress"],
["Curl femoral","3 × 10–12","Controlado","legcurl"],
["Extensión de piernas","3 × 12","Sin rebotes","extension"],
["Hip thrust","3 × 10–12","Máquina","hip"],
["Abductores","2 × 15","Controlado","abductor"],
["Gemelos","2 × 15","Solo si el tobillo está cómodo","calf"],
["Cardio","15 min","Bicicleta o elíptica","cardio"]]]
];

function svg(type){
let machine=`<path class="machine" d="M35 145H255M60 145V35M60 35H115M230 145V65M230 65H190"/>`;
let p=(x,y,pose,final=false)=>`<circle cx="${x}" cy="${y}" r="13" fill="#f4c7a1" stroke="#111827" stroke-width="4"/><path class="person" d="${pose}"/>`;
let muscle=`<ellipse class="muscle" cx="0" cy="0" rx="11" ry="18"/>`;
let A="",B="";
if(type==="press"){A=p(110,48,"M110 62L110 104L78 130M110 104L142 130M78 130L65 150M142 130L155 150");B=p(145,48,"M145 62L145 104L110 130M145 104L180 130M110 130L98 150M180 130L192 150");A+=`<path class="machine" d="M72 88H148M72 88V118M148 88V118"/>`;B+=`<path class="machine" d="M105 88H185M105 88V118M185 88V118"/>`}
else if(type==="pulldown"){A=p(125,54,"M125 68L125 108L105 140M125 108L145 140M105 140L95 155M145 140L155 155");A+=`<path class="machine" d="M55 28H195M65 28V105M185 28V105M65 45H185"/>`;B=p(125,54,"M125 68L125 108L105 140M125 108L145 140M105 140L95 155M145 140L155 155");B+=`<path class="machine" d="M55 28H195M65 28V105M185 28V105M85 72H165"/>`}
else if(type==="row"){A=p(105,54,"M105 68L105 103L83 135M105 103L130 135M83 135L75 153M130 135L140 153");B=p(105,54,"M105 68L105 103L83 135M105 103L130 135M83 135L75 153M130 135L140 153");A+=`<path class="machine" d="M55 105H155M55 105V150M155 105V150M85 92H125"/>`;B+=`<path class="machine" d="M55 105H155M55 105V150M155 105V150M75 92H135"/>`}
else if(type==="incline"){A=p(110,55,"M110 68L110 104L83 135M110 104L138 135M83 135L73 153M138 135L148 153");B=p(138,55,"M138 68L138 104L108 135M138 104L168 135M108 135L98 153M168 135L178 153");A+=`<path class="machine" d="M70 135H160M75 135V65M155 135V65M85 78H145"/>`;B+=`<path class="machine" d="M95 135H190M100 135V65M185 135V65M110 78H175"/>`}
else if(type==="curl"){A=p(110,52,"M110 66L110 105L85 140M110 105L135 140M85 140L78 155M135 140L143 155M88 90L62 115");B=p(110,52,"M110 66L110 105L85 140M110 105L135 140M85 140L78 155M135 140L143 155M88 90L70 76");A+=`<path class="machine" d="M50 155H160M65 155V125"/>`;B+=`<path class="machine" d="M50 155H160M65 155V125"/>`}
else if(type==="triceps"){A=p(115,52,"M115 66L115 105L90 140M115 105L140 140M90 140L82 155M140 140L148 155M93 88L72 115");B=p(115,52,"M115 66L115 105L90 140M115 105L140 140M90 140L82 155M140 140L148 155M93 88L93 125");A+=`<path class="machine" d="M65 30V150M65 30H150M150 30V150"/>`;B+=`<path class="machine" d="M65 30V150M65 30H150M150 30V150"/>`}
else if(type==="legpress"){A=p(105,58,"M105 72L125 105L95 135M125 105L150 135M95 135L85 153M150 135L160 153");B=p(135,58,"M135 72L145 105L120 135M145 105L175 135M120 135L110 153M175 135L185 153");A+=`<path class="machine" d="M55 35H210L185 145H65ZM65 70H175"/>`;B+=`<path class="machine" d="M55 35H210L185 145H65ZM65 70H185"/>`}
else if(type==="legcurl"){A=p(110,50,"M110 64L105 100L85 135M105 100L130 135M85 135L78 153M130 135L138 153");B=p(110,50,"M110 64L105 100L80 135M105 100L135 125M80 135L73 153M135 125L145 145");A+=`<path class="machine" d="M60 145H165M70 145V85M150 145V80"/>`;B+=`<path class="machine" d="M60 145H165M70 145V85M150 145V80"/>`}
else if(type==="extension"){A=p(105,50,"M105 64L105 102L85 135M105 102L130 135M85 135L78 153M130 135L138 153");B=p(105,50,"M105 64L105 102L85 135M105 102L145 125M85 135L78 153M145 125L155 145");A+=`<path class="machine" d="M65 145H170M75 145V85M155 145V80"/>`;B+=`<path class="machine" d="M65 145H170M75 145V85M155 145V80"/>`}
else if(type==="hip"){A=p(105,65,"M105 79L85 110L70 140M85 110L125 140M70 140L65 155M125 140L135 155");B=p(105,65,"M105 79L90 105L75 135M90 105L135 105M75 135L68 153M135 105L155 95");A+=`<path class="machine" d="M55 145H165M60 145V105M160 145V95"/>`;B+=`<path class="machine" d="M55 145H165M60 145V105M160 145V95"/>`}
else if(type==="abductor"){A=p(105,50,"M105 64L105 103L90 140M105 103L120 140M90 140L82 155M120 140L128 155");B=p(105,50,"M105 64L105 103L75 140M105 103L140 140M75 140L67 155M140 140L148 155");A+=`<path class="machine" d="M60 145H155M70 145V95M145 145V95"/>`;B+=`<path class="machine" d="M60 145H155M70 145V95M145 145V95"/>`}
else if(type==="calf"){A=p(105,50,"M105 64L105 105L90 140M105 105L120 140M90 140L82 153M120 140L128 153");B=p(105,43,"M105 57L105 98L90 133M105 98L120 133M90 133L82 146M120 133L128 146");A+=`<path class="machine" d="M65 145H150M75 145V70M140 145V70M75 70H140"/>`;B+=`<path class="machine" d="M65 138H150M75 138V70M140 138V70M75 70H140"/>`}
else return `<div style="text-align:center;font-size:55px;padding:35px">🚴</div>`;
return `<svg viewBox="0 0 270 175"><g transform="translate(0,0)">${A}</g><g transform="translate(130,0)">${B}</g></svg>`;
}
let day=0,t=90,intv;
function render(){document.querySelectorAll(".tab").forEach((x,i)=>x.classList.toggle("active",i===day));let w=data[day],key="d"+day,done=JSON.parse(localStorage.getItem(key)||"[]");document.getElementById("app").innerHTML=`<section class="card"><div class="day"><h2>${w[0]}</h2><span class="tag">${w[1]}</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="list"></div></section>`;let list=document.getElementById("list");w[2].forEach((e,i)=>{let d=document.createElement("div");d.className="exercise";d.innerHTML=`<div class="title"><h3>${i+1}. ${e[0]}</h3><span class="sets">${e[1]}</span></div><figure>${svg(e[3])}<div class="caption"><span>POSICIÓN INICIAL</span><span>POSICIÓN FINAL</span></div></figure><div class="note">💡 ${e[2]}</div><br><button class="action ${done.includes(i)?"done":""}" onclick="toggle(${i},this)">${done.includes(i)?"✓ Completado":"Marcar ejercicio"}</button> <button class="action" onclick="start(90)">⏱ 90 s</button></div>`;list.appendChild(d)});document.getElementById("bar").style.width=(done.length/w[2].length*100)+"%"}
function toggle(i,b){let k="d"+day,d=JSON.parse(localStorage.getItem(k)||"[]");d=d.includes(i)?d.filter(x=>x!==i):[...d,i];localStorage.setItem(k,JSON.stringify(d));render()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function start(s){clearInterval(intv);t=s;clock.textContent=fmt(t);intv=setInterval(()=>{clock.textContent=fmt(--t);if(t<=0){clearInterval(intv);navigator.vibrate?.(300)}},1000)}
function reset(){clearInterval(intv);t=90;clock.textContent=fmt(t)}
data.forEach((x,i)=>{let b=document.createElement("button");b.className="tab"+(!i?" active":"");b.textContent=x[0];b.onclick=()=>{day=i;render()};tabs.appendChild(b)});render();
</script>
</body></html>
